<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Test Request</title>
    <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
<div class="header">
    <h1>📝 Create New Test Request</h1>
    <p>Submit a batch for quality testing</p>
</div>

<div class="form-container">
    <form action="/requests" method="post">
        <label>Batch Number:</label>
        <input type="text" name="batchNumber" required placeholder="Example: E7018-001">

        <label>Electrode Type:</label>
        <input type="text" name="electrodeType" required placeholder="Example: E7018">

        <label>Requested By (Your Name):</label>
        <input type="text" name="requestedBy" required placeholder="QC Officer Name">

        <button type="submit">✅ Submit Request</button>
    </form>

    <div class="text-center" style="margin-top: 20px;">
        <a href="/" class="back">← Back to Dashboard</a>
    </div>
</div>

<footer>
    <p>Electrode QC Lab System | Quality Control</p>
</footer>

<script src="/js/main.js"></script>
</body>
</html>
