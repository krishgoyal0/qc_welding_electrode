spring.application.name=electrode-qc-lab
spring.datasource.url=jdbc:mysql://localhost:3306/electrode_qc?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false
coa.directory=./coa-reports/
qr.code.directory=./qr-codes/